<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="320" height="380" role="img" aria-label="Animated classic Macintosh booting up">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8B0A0"/>
      <stop offset="6%" stop-color="#D6CFBE"/>
      <stop offset="50%" stop-color="#E0D9C7"/>
      <stop offset="94%" stop-color="#D6CFBE"/>
      <stop offset="100%" stop-color="#B8B0A0"/>
    </linearGradient>
    <linearGradient id="bodyTopShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="80%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="crtGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#C8D4B8" stop-opacity="0.0"/>
      <stop offset="70%" stop-color="#9AAA8E" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <pattern id="scan" x="0" y="0" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect width="2" height="1" fill="#000" opacity="0.10"/>
    </pattern>
    <clipPath id="screenClip">
      <rect x="62" y="57" width="196" height="156" rx="3"/>
    </clipPath>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Drop shadow -->
  <ellipse cx="160" cy="372" rx="130" ry="5" fill="#000" opacity="0.22"/>

  <!-- Main body -->
  <path d="M 40 20 L 280 20 Q 290 20 290 30 L 290 318 Q 290 330 278 330 L 202 330 L 197 354 Q 197 360 191 360 L 129 360 Q 123 360 123 354 L 118 330 L 42 330 Q 30 330 30 318 L 30 30 Q 30 20 40 20 Z"
        fill="url(#body)" stroke="#6B6452" stroke-width="0.8"/>
  <path d="M 40 20 L 280 20 Q 290 20 290 30 L 290 318 Q 290 330 278 330 L 202 330 L 197 354 Q 197 360 191 360 L 129 360 Q 123 360 123 354 L 118 330 L 42 330 Q 30 330 30 318 L 30 30 Q 30 20 40 20 Z"
        fill="url(#bodyTopShade)"/>

  <!-- Top vent slits -->
  <g fill="#7A7263" opacity="0.55">
    <rect x="115" y="33" width="90" height="1.4" rx="0.7"/>
    <rect x="115" y="37" width="90" height="1.4" rx="0.7"/>
    <rect x="115" y="41" width="90" height="1.4" rx="0.7"/>
  </g>

  <!-- Screen recess -->
  <rect x="52" y="50" width="216" height="170" rx="6" fill="#1E1B16"/>
  <rect x="56" y="54" width="208" height="162" rx="4" fill="#0B0A07"/>

  <!-- Screen (animated) -->
  <g clip-path="url(#screenClip)">
    <!-- Base screen color: off → flash → CRT warm → settled green-gray -->
    <rect x="62" y="57" width="196" height="156" fill="#000">
      <animate attributeName="fill"
        values="#000;#000;#F4F2E8;#D0CFC0;#9AAA8E;#9AAA8E;#9AAA8E;#000"
        keyTimes="0;0.04;0.06;0.10;0.18;0.94;0.97;1"
        dur="9s" repeatCount="indefinite"/>
    </rect>
    <!-- CRT scanlines (only while screen is on) -->
    <rect x="62" y="57" width="196" height="156" fill="url(#scan)" opacity="0">
      <animate attributeName="opacity"
        values="0;0;0;0;1;1;1;0"
        keyTimes="0;0.04;0.06;0.10;0.18;0.94;0.97;1"
        dur="9s" repeatCount="indefinite"/>
    </rect>
    <!-- CRT vignette / glow ring -->
    <rect x="62" y="57" width="196" height="156" fill="url(#crtGlow)" opacity="0">
      <animate attributeName="opacity"
        values="0;0;0;0;1;1;1;0"
        keyTimes="0;0.04;0.06;0.10;0.18;0.94;0.97;1"
        dur="9s" repeatCount="indefinite"/>
    </rect>
    <!-- Power-on horizontal sweep line -->
    <rect x="62" y="134" width="196" height="3" fill="#FFFFFF" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0.3;0;0" keyTimes="0;0.05;0.07;0.09;0.11;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="height" values="156;156;2;30;1;1" keyTimes="0;0.05;0.07;0.09;0.11;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="57;57;134;120;213;213" keyTimes="0;0.05;0.07;0.09;0.11;1" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- Happy Mac icon (drawn at screen center 160,135) -->
    <g transform="translate(160 135)" opacity="0">
      <animate attributeName="opacity"
        values="0;0;0;0;0;1;1;1;0"
        keyTimes="0;0.04;0.10;0.18;0.22;0.27;0.94;0.97;1"
        dur="9s" repeatCount="indefinite"/>
      <!-- Icon body outline -->
      <rect x="-38" y="-40" width="76" height="80" rx="3" fill="none" stroke="#0A0A07" stroke-width="3.5" stroke-linejoin="round"/>
      <!-- Floppy slot line on icon -->
      <line x1="-22" y1="26" x2="22" y2="26" stroke="#0A0A07" stroke-width="3" stroke-linecap="round"/>
      <!-- Left eye -->
      <ellipse cx="-13" cy="-12" rx="3.6" ry="3.6" fill="#0A0A07">
        <animate attributeName="ry"
          values="3.6;3.6;3.6;3.6;0.4;3.6;3.6;3.6;3.6;3.6;0.4;3.6;3.6"
          keyTimes="0;0.30;0.42;0.44;0.45;0.46;0.47;0.55;0.71;0.73;0.74;0.75;1"
          dur="9s" repeatCount="indefinite"/>
      </ellipse>
      <!-- Right eye -->
      <ellipse cx="13" cy="-12" rx="3.6" ry="3.6" fill="#0A0A07">
        <animate attributeName="ry"
          values="3.6;3.6;3.6;3.6;0.4;3.6;3.6;3.6;3.6;3.6;0.4;3.6;3.6"
          keyTimes="0;0.30;0.42;0.44;0.45;0.46;0.47;0.55;0.71;0.73;0.74;0.75;1"
          dur="9s" repeatCount="indefinite"/>
      </ellipse>
      <!-- Smile -->
      <path d="M -11 4 Q 0 14 11 4" fill="none" stroke="#0A0A07" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- CRT collapse line on shutdown -->
    <rect x="62" y="134" width="0" height="2" fill="#FFFFFF" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.93;0.94;0.95;0.97;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="width" values="0;0;196;196;30;0" keyTimes="0;0.93;0.94;0.96;0.97;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x" values="62;62;62;62;145;160" keyTimes="0;0.93;0.94;0.96;0.97;1" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Below screen: apple logo, brand text, floppy slot, LED -->
  <!-- Simplified Apple silhouette -->
  <g transform="translate(60 240)" fill="#6B6452">
    <path d="M 8.5 4 C 9.6 1.6 11.4 1.4 12.6 1.6 C 12.4 3 11.6 3.9 10.4 4.2 C 11.2 4 12.7 3.9 14 4.7 C 14.9 5.3 15.6 6.2 15.8 7.3 C 15 7.7 14.1 8.7 14 10.1 C 13.9 11.6 14.9 12.6 15.7 13 C 15.2 14.4 14.4 15.7 13.2 16.1 C 12.2 16.4 11.4 15.9 10.5 15.9 C 9.6 15.9 8.7 16.4 7.8 16.1 C 6 15.5 4.4 13.1 3.9 10.4 C 3.3 7.1 4.6 4.5 6.4 4 C 7.2 3.8 7.9 3.9 8.5 4 Z"/>
  </g>

  <!-- Brand text -->
  <text x="160" y="252" font-family="Charcoal, 'Chicago', 'Geneva', sans-serif" font-size="11" fill="#5A5446" text-anchor="middle" font-weight="700" letter-spacing="0.6">Macintosh</text>

  <!-- Floppy drive slot -->
  <g>
    <rect x="100" y="270" width="120" height="11" fill="#403A30" rx="2"/>
    <rect x="103" y="273" width="114" height="5" fill="#0A0907" rx="1"/>
    <rect x="210" y="275" width="6" height="2" fill="#9D9787" rx="0.5"/>
  </g>

  <!-- Power LED -->
  <g>
    <circle cx="270" cy="276" r="3" fill="#2A2820"/>
    <circle cx="270" cy="276" r="2.2" fill="#2A2820">
      <animate attributeName="fill"
        values="#2A2820;#2A2820;#6FE356;#6FE356;#6FE356;#2A2820"
        keyTimes="0;0.04;0.06;0.10;0.95;1"
        dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="270" cy="276" r="4.5" fill="#6FE356" opacity="0">
      <animate attributeName="opacity"
        values="0;0;0.45;0.35;0.35;0"
        keyTimes="0;0.04;0.06;0.10;0.95;1"
        dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Programmer's switch (tiny detail on side, just hint) -->
  <rect x="288" y="120" width="2" height="14" fill="#7A7263" opacity="0.5"/>

  <!-- Base feet shading -->
  <path d="M 123 354 L 197 354 L 191 360 L 129 360 Z" fill="#000" opacity="0.10"/>
</svg>
